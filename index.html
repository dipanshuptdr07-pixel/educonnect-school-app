<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#3157d5"
  >

  <meta
    name="description"
    content="EduConnect - School Management Platform"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="EduConnect"
  >

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <link
    rel="icon"
    href="./icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="./icon-192.png"
  >

  <link
    rel="stylesheet"
    href="./style.css"
  >

  <title>
    EduConnect
  </title>

</head>

<body>

  <div id="app"></div>

  <script src="./app.js?v=14"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener(
        "load",
        () => {
          navigator.serviceWorker.register(
            "./service-worker.js"
          );
        }
      );
    }
  </script>

</body>

</html>
